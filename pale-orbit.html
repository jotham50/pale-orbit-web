/*
 * A random number generator that produces exactly the same numbers as
 * Python's `random.Random(seed)` (CPython 3.11+), so a moon seed gives the
 * same layout here as in the Python version of Pale Orbit.
 *
 * It is a port of CPython's Mersenne Twister (MT19937) together with the
 * pure-Python helpers in Lib/random.py that the game uses: random(),
 * uniform(), randrange(), randint(), choice(), shuffle() and sample().
 */
(function (root) {
  "use strict";

  const N = 624, M = 397;
  const MATRIX_A = 0x9908b0df, UPPER = 0x80000000, LOWER = 0x7fffffff;

  class PyRandom {
    constructor(seed) {
      this.mt = new Uint32Array(N);
      this.mti = N + 1;

    }

    // --- seeding (CPython random_seed + init_by_array) ---------------------
    _initGenrand(s) {
      const mt = this.mt;
      mt[0] = s >>> 0;
      for (let i = 1; i < N; i++) {
        const prev = mt[i - 1] ^ (mt[i - 1] >>> 30);
        // 1812433253 * prev + i, in 32-bit arithmetic
        mt[i] = (Math.imul(1812433253, prev) + i) >>> 0;
      }

    }

    _initByArray(key) {
      const mt = this.mt;
      this._initGenrand(19650218);
      let i = 1, j = 0;
      for (let k = Math.max(N, key.length); k; k--) {
        const prev = mt[i - 1] ^ (mt[i - 1] >>> 30);
        mt[i] = ((mt[i] ^ Math.imul(prev, 1664525)) + key[j] + j) >>> 0;
        i++; j++;
        if (i >= N) { mt[0] = mt[N - 1]; i = 1; }
        if (j >= key.length) j = 0;
      }
      for (let k = N - 1; k; k--) {
        const prev = mt[i - 1] ^ (mt[i - 1] >>> 30);
        mt[i] = ((mt[i] ^ Math.imul(prev, 1566083941)) - i) >>> 0;
        i++;
        if (i >= N) { mt[0] = mt[N - 1]; i = 1; }

    _genrand() {

    [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1],

    "Ember Shelf", "Vesper Gorge", "Slate Expanse", "Frost Hollow", "Signal Peak",

    return ICO_FACES.map((face, i) => {

      }
      for (const vault of candidates) {
        if (this.vaults.size >= count) break;
        if (this.sectors[vault].neighbours.some((n) => this.vaults.has(n))) continue;
        const entries = this.sectors[vault].neighbours.filter((n) => !this.sealed.has(n));
        const entry = this.rng.choice(entries);
        const others = this.sectors[vault].neighbours.filter((n) => n !== entry);
        this.rng.shuffle(others);
        const rock = edgeKey(vault, others[0]), bulkhead = edgeKey(vault, others[1]);
        const entrance = edgeKey(vault, entry);
        this.vaults.add(vault);
        this.rubble.add(rock);
        this.locks.set(entrance, -1);
        this.locks.set(bulkhead, -1);
        const expected = new Set([...Array(20).keys()].filter(
          (s) => !this.sealed.has(s) && !this.vaults.has(s)));
        if (!setEq(this.walkableFrom(this.startSector), expected)) {
          this.vaults.delete(vault);
          this.rubble.delete(rock);
          this.locks.delete(entrance);
          this.locks.delete(bulkhead);
          continue;
        }
        const pid = this._makeSlide(entry, vault);
        this.locks.set(entrance, pid);
        this.locks.set(bulkhead, pid);
      }
      const missing = this._scatterRubble(2 * this.vaults.size - this.rubble.size);
      const bulkheads = [...this.locks.keys()].filter((e) => !this._isEntrance(e));
      for (const edge of bulkheads.slice(0, Math.max(0, missing))) {
        this.locks.delete(edge);
        this.rubble.add(edge);
      }
    }

    _isEntrance(edge) {
      const pz = this.slides[this.locks.get(edge)];
      return edge === edgeKey(pz.sector, pz.vault);
    }

    _scatterRubble(count) {
      const avoid = new Set([...this.sealed, ...this.vaults]);
      let edges = [];
      for (let a = 0; a < 20; a++) {
        for (const b of this.sectors[a].neighbours) {
          if (a < b && !avoid.has(a) && !avoid.has(b)) edges.push(edgeKey(a, b));
        }
      }
      edges = edges.filter((e) => !this.rubble.has(e) && !this.locks.has(e));
      this.rng.shuffle(edges);
      const expected = new Set([...Array(20).keys()].filter((s) => !avoid.has(s)));
      let placed = 0;
      for (const strict of [true, false]) {
        for (const e of edges) {
          if (placed >= count) return 0;
          if (this.rubble.has(e)) continue;
          if (strict && edgeEnds(e).some((x) => this.sectors[x].neighbours
              .filter((n) => this.gateOpen(x, n)).length <= 2)) continue;
          this.rubble.add(e);
          if (!setEq(this.walkableFrom(this.startSector), expected)) {
            this.rubble.delete(e);
            continue;
          }
          placed += 1;
        }
      }
      return Math.max(0, count - placed);
    }

    _makeSlide(sector, vault) {
      const g = this.sectors[sector].neighbours.indexOf(vault);
      const [gx, gz] = gatePosition(g);
      const ux = gx / GATE_RADIUS, uz = gz / GATE_RADIUS;
      const side = this.rng.choice([-1, 1]);
      const x = ux * 40 + uz * 9 * side, z = uz * 40 - ux * 9 * side;
      this._placed[sector].push([x, z, 5.0]);
      const pz = new SlidePuzzle(this.slides.length, sector, vault, x, z,
                                 SlidePuzzle.SOLVED.slice());
      let last = null;
      const isSolved = () => pz.tiles.every((v, i) => v === SlidePuzzle.SOLVED[i]);
      while (isSolved() || pz.scramble.length < 40) {
        const gap = pz.tiles.indexOf(0);
        const options = pz.neighboursOf(gap).filter((c) => c !== last);
        const cell = this.rng.choice(options);
        pz.move(cell);
        pz.solved = false;
        pz.scramble.push(gap);
        last = gap;
      }
      this.slides.push(pz);
      return pz.id;
    }

    _newSilo(sector) {
      const [x, z] = this._freeSpot(sector, 8.5, 14.0);
      const silo = new Silo(sector, x, z, this.rng.uniform(9, 12));
      this.silos.push(silo);
      return silo;
    }

    silosIn(sector) { return this.silos.filter((s) => s.sector === sector); }

    _makePuzzle(sector, teleporter) {
      const n = this.rng.randint(3, 5);
      const positions = [];
      for (let i = 0; i < n; i++) positions.push(this._freeSpot(sector, 3.0));
      if (this.rng.random() < this.siloChance) {
        const silo = this._newSilo(sector);
        const picks = this.rng.sample([...Array(n).keys()], this.rng.choice([1, 2]));
        picks.forEach((i, k) => { positions[i] = silo.innerSpot(k); });
      }
      const links = [];
      for (let i = 0; i < n; i++) {
        const others = [...Array(n).keys()].filter((j) => j !== i);
        links.push(this.rng.sample(others, this.rng.randint(1, Math.min(2, n - 1)))
          .sort((a, b) => a - b));
      }
      const state = new Array(n).fill(true);
      const puzzle = new SwitchPuzzle(this.puzzles.length, sector, positions, links, state,
                                      teleporter);
      while (puzzle.state.every(Boolean)) {
        for (let i = 0; i < n; i++) if (this.rng.random() < 0.5) puzzle.press(i);
      }
      puzzle.solved = false;
      this.puzzles.push(puzzle);
      return puzzle.id;
    }

    _buildWards(fraction) {
      for (const lat of this.lattices) {
        if (this.rng.random() < fraction) {
          const endCore = this.cores[this.rng.choice([lat[0], lat[lat.length - 1]])];
          let x, z;
          if (this.rng.random() < this.siloChance) {
            const silo = this._newSilo(endCore.sector);
            [x, z] = silo.innerSpot(this.rng.randrange(4));
          } else {
            [x, z] = this._freeSpot(endCore.sector, 3.0);
          }
          const b = { id: this.breakers.length, sector: endCore.sector, x, z,
                      core: endCore.id, tripped: false };
          this.breakers.push(b);
          endCore.warded = true;
          endCore.breaker = b.id;
        }
      }
    }

    _corridorClear(sector, a, b, ignoreEnd = false) {
      const length = dist(a, b);
      const steps = Math.max(1, Math.floor(length / 2));
      const lim = SECTOR_HALF_SIZE - 8;
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const x = a[0] + (b[0] - a[0]) * t, z = a[1] + (b[1] - a[1]) * t;
        if (Math.abs(x) > lim || Math.abs(z) > lim) return false;
        if (ignoreEnd && dist([x, z], b) < 5) continue;
        if (this._placed[sector].some(([px, pz, pr]) => hypot(x - px, z - pz) < pr + 1.8)) {
          return false;
        }
      }
      return true;
    }

    _buildRelays(count) {
      const used = new Set([...this.vaults, ...this.sealed]);
      const candidates = this.cores.filter((c) => !c.warded && !used.has(c.sector));
      this.rng.shuffle(candidates);
      for (const core of candidates) {
        if (this.relayPuzzles.length >= count) break;
        if (this.relayPuzzles.some((p) => p.sector === core.sector)) continue;
        const route = this._planRelayRoute(core);
        if (route === null) continue;
        const [[ex, ez, efacing], stops] = route;
        const pid = this.relayPuzzles.length;
        const ids = [];
        for (const [x, z, sol] of stops) {
          const wrong = [0, 1, 2, 3, 4, 5, 6, 7].filter((f) => f !== sol);
          const r = { id: this.relays.length, puzzle: pid, x, z,
                      facing: this.rng.choice(wrong), solution: sol };
          this.relays.push(r);
          ids.push(r.id);
        }
        const [dx, dz] = this._freeSpot(core.sector, 2.5);
        const decoy = { id: this.relays.length, puzzle: pid, x: dx, z: dz,
                        facing: this.rng.randrange(8), solution: null };
        this.relays.push(decoy);
        ids.push(decoy.id);
        this.relayPuzzles.push({ id: pid, sector: core.sector, core: core.id, ex, ez, efacing,
                                 relays: ids });
        core.relayLocked = true;
        core.height = 1.0;
        while (this.traceBeam(pid)[1] === "core") {
          for (const rid of ids) this.relays[rid].facing = this.rng.randrange(8);
        }
      }
    }

    _planRelayRoute(core) {
      const sec = core.sector;
      for (let attempt = 0; attempt < 60; attempt++) {
        const nRelays = this.rng.choice([2, 2, 3]);
        let point = [core.x, core.z];
        let facing = this.rng.choice([0, 2, 4, 6]);
        const stops = [];
        let ok = true, emitter = null;
        for (let k = 0; k <= nRelays; k++) {
          const length = this.rng.uniform(12, 20);
          const [vx, vz] = facingVector(facing);
          const prev = [point[0] - vx * length, point[1] - vz * length];
          if (!this._corridorClear(sec, prev, point, k === 0)) { ok = false; break; }
          if (k < nRelays) {
            stops.push([prev[0], prev[1], facing]);
            facing = (facing + this.rng.choice([2, 6])) % 8;
          } else {
            emitter = [prev[0], prev[1], facing];
          }
          point = prev;
        }
        if (!ok) continue;
        const pts = [...stops.map(([x, z]) => [x, z]), [emitter[0], emitter[1]]];
        let tooClose = false;
        for (let i = 0; i < pts.length && !tooClose; i++) {
          for (let j = i + 1; j < pts.length; j++) if (dist(pts[i], pts[j]) < 6) tooClose = true;
        }
        if (tooClose) continue;
        for (const [x, z] of pts) this._placed[sec].push([x, z, 2.5]);
        const path = [[core.x, core.z], ...pts];
        for (let p = 0; p + 1 < path.length; p++) {
          const a = path[p], b = path[p + 1];
          const steps = Math.max(1, Math.floor(dist(a, b) / 3));
          for (let i = 1; i < steps; i++) {
            const t = i / steps;
            this._placed[sec].push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, 1.5]);
          }
        }
        return [emitter, stops.slice().reverse()];
      }
      return null;
    }

    _buildSentries() {
      for (let sec = 0; sec < 20; sec++) {
        const n = this.rng.choice([0, 1, 1, 2]);
        for (let i = 0; i < n; i++) {
          const [x, z] = this._freeSpot(sec, 4.0, 14.0);
          this.sentries.push({ id: this.sentries.length, sector: sec, x, z, alive: true });
        }
      }
    }

    _addBuilding(sec, x, z, style) {
      const r = (a, b) => this.rng.uniform(a, b);
      let b;
      if (style === "bunker") {
        b = { x, z, w: r(6, 11), d: r(4, 7), h: r(3, 4.5), rot: r(0, 90), style };
      } else if (style === "tower") {
        const s = r(3.5, 5.5);
        b = { x, z, w: s, d: s, h: r(9, 16), rot: r(0, 90), style };
      } else if (style === "dome") {
        const s = r(7, 12);
        b = { x, z, w: s, d: s, h: s * 0.5, rot: 0, style };
      } else if (style === "hangar") {
        b = { x, z, w: r(12, 18), d: r(8, 11), h: r(5, 7), rot: r(0, 90), style };
      } else {
        b = { x, z, w: r(2, 6), d: r(2, 6), h: r(1.2, 3.5), rot: r(0, 90), style };
      }
      sec.buildings.push(b);
    }

    _buildBuildings() {
      const styles = ["bunker", "bunker", "tower", "dome", "hangar"];
      for (const sec of this.sectors) {
        for (const sentry of this.sentriesIn(sec.id)) {
          for (let k = 0; k < 2; k++) {
            for (let t = 0; t < 40; t++) {
              const a = this.rng.uniform(0, TAU);
              const d = this.rng.uniform(12, 22);
              const x = sentry.x + Math.cos(a) * d, z = sentry.z + Math.sin(a) * d;
              const lim = SECTOR_HALF_SIZE - 10;
              if (Math.abs(x) < lim && Math.abs(z) < lim
                  && this._placed[sec.id].every(([px, pz, pr]) => hypot(x - px, z - pz) > 6 + pr)
                  && !this.chasmsIn(sec.id).some((ch) => ch.contains(x, z, 8))) {
                this._placed[sec.id].push([x, z, 6.0]);
                this._addBuilding(sec, x, z, this.rng.choice(["bunker", "hangar"]));
                break;
              }
            }
          }
        }
        const nb = this.rng.randint(6, 10);
        for (let i = 0; i < nb; i++) {
          const [x, z] = this._freeSpot(sec.id, 7.0);
          this._addBuilding(sec, x, z, this.rng.choice(styles));
        }
        const nr = this.rng.randint(8, 14);
        for (let i = 0; i < nr; i++) {
          const [x, z] = this._freeSpot(sec.id, 3.0, 6.0);
          this._addBuilding(sec, x, z, "rock");
        }
      }
    }

    _buildChasms(count) {
      const candidates = [...Array(20).keys()].filter((s) => s !== this.startSector);
      this.rng.shuffle(candidates);
      const lim = SECTOR_HALF_SIZE;
      for (const sec of candidates) {
        if (this.chasms.length >= count) break;
        const gates = this.rng.shuffle([0, 1, 2]);
        let placed = false;
        for (const g of gates) {
          for (let t = 0; t < 40; t++) {
            const w = this.rng.uniform(8, 15);
            const lo = SPAWN_CLEAR_RADIUS + 4 + w / 2, hi = GATE_RADIUS - 10 - w / 2;
            if (lo >= hi) continue;
            const ch = new Chasm(sec, g, this.rng.uniform(lo, hi), w);
            if (this._placed[sec].every(([px, pz, pr]) =>
                !(Math.abs(px) < lim && Math.abs(pz) < lim) || !ch.contains(px, pz, pr + 1.0))) {
              this.chasms.push(ch);
              placed = true;
              break;
            }
          }
          if (placed) break;
        }
      }
    }

    _buildPacks() {
      const kinds = ["shield", "shield", "fuel", "combo"];
      for (let sec = 0; sec < 20; sec++) {
        const n = this.rng.randint(2, 4);
        for (let i = 0; i < n; i++) {
          const [x, z] = this._freeSpot(sec, 2.0);
          this.packs.push({ id: this.packs.length, sector: sec, x, z,
                            kind: this.rng.choice(kinds), taken: false });
        }
      }
    }

    // ---- queries ---------------------------------------------------------
    get totalCores() { return this.cores.length; }
    get liveCores() { return this.cores.filter((c) => c.alive).length; }
    get sunDirection() { return sunDirectionAt(this.elapsed); }

    sunlightTrend(sector, ahead = 30.0) {
      return sectorSunlight(sector, sunDirectionAt(this.elapsed + ahead))
        - this.sectors[sector].sunlight;
    }

    _updateSunlight() {
      const sun = this.sunDirection;
      for (const sec of this.sectors) sec.sunlight = sectorSunlight(sec.id, sun);
      for (const c of this.cores) c.output = outputFor(this.sectors[c.sector].sunlight);
    }

    get power() {
      let live = 0;
      for (const c of this.cores) if (c.alive) live += c.output;
      return this.refOutput ? live / this.refOutput : 0.0;
    }

    get chargeRate() { return this.power / Moon.FULL_CHARGE_TIME; }

    _powerAt(t, liveBySector) {
      const sun = sunDirectionAt(t);
      let out = 0;
      liveBySector.forEach((n, s) => { if (n) out += n * outputFor(sectorSunlight(s, sun)); });
      return this.refOutput ? out / this.refOutput : 0.0;
    }

    _predictFireTime() {
      const live = new Array(20).fill(0);
      for (const c of this.cores) if (c.alive) live[c.sector] += 1;
      if (!live.some(Boolean)) return Infinity;
      let t = this.elapsed, charge = this.charge;
      const step = Moon.PREDICT_STEP;
      while (charge < 1.0) {
        const gain = this._powerAt(t + step / 2, live) / Moon.FULL_CHARGE_TIME * step;
        if (gain <= 0) return Infinity;
        if (charge + gain >= 1.0) return t + step * (1.0 - charge) / gain;
        charge += gain;
        t += step;
        if (t - this.elapsed > Moon.PREDICT_HORIZON) return Infinity;
      }
      return t;
    }

    /** Seconds until the Lance fires if no more cores change (follows the sun). */
    get timeToFire() {
      const key = this.cores.map((c) => (c.alive ? 1 : 0)).join("");
      let cache = this._fireCache;
      if (!cache || cache[0] !== key || this.elapsed - cache[1] > 10.0
          || this.elapsed < cache[1]) {
        cache = [key, this.elapsed, this._predictFireTime()];
        this._fireCache = cache;
      }
      return Math.max(0.0, cache[2] - this.elapsed);
    }

    neighbours(core) {
      const lat = this.lattices[core.lattice];
      return [core.index - 1, core.index + 1].filter((i) => i >= 0 && i < lat.length)
        .map((i) => this.cores[lat[i]]);
    }
    isTerminus(core) {
      return core.index === 0 || core.index === this.lattices[core.lattice].length - 1;
    }
    willRegenerate(core) {
      const n = this.neighbours(core);
      return n.length === 2 && n.every((c) => c.alive);
    }
    latticeAlive(lattice) {
      return this.lattices[lattice].filter((i) => this.cores[i].alive).length;
    }
    coresIn(s) { return this.cores.filter((c) => c.sector === s); }
    breakersIn(s) { return this.breakers.filter((b) => b.sector === s); }
    sentriesIn(s) { return this.sentries.filter((x) => x.sector === s); }
    packsIn(s) { return this.packs.filter((p) => p.sector === s); }
    teleportersIn(s) { return this.teleporters.filter((t) => t.sector === s); }
    puzzlesIn(s) { return this.puzzles.filter((p) => p.sector === s); }
    chasmsIn(s) { return this.chasms.filter((c) => c.sector === s); }
    overChasm(sector, x, z) { return this.chasmsIn(sector).some((c) => c.contains(x, z)); }

    gateState(from, to) {
      const edge = edgeKey(from, to);
      if (this.sealed.has(to)) return "sealed";
      if (this.rubble.has(edge)) return "rubble";
      if (this.locks.has(edge)) {
        const pid = this.locks.get(edge);
        if (pid < 0 || !this.slides[pid].solved) return "locked";
      }
      return "open";
    }

    lockedArea(sector) {
      if (this.sealed.has(sector)) {
        const wayIn = this.teleporters.filter((t) => t.dest === sector && t.puzzle !== null);
        if (!wayIn.some((t) => t.active)) return "sealed";
      }
      if (this.vaults.has(sector)) {
        const edge = [...this.locks.keys()].find((e) => edgeEnds(e).includes(sector));
        if (edge !== undefined) {
          const outside = edgeEnds(edge).find((x) => x !== sector);
          if (this.gateState(outside, sector) !== "open") return "vault";
        }
      }
      return null;
    }

    lockedEnds(lattice) {
      const lat = this.lattices[lattice];
      const ids = lat[0] === lat[lat.length - 1] ? [lat[0]] : [lat[0], lat[lat.length - 1]];
      const out = [];
      for (const cid of ids) {
        const c = this.cores[cid];
        const kind = this.lockedArea(c.sector);
        if (c.alive && kind) out.push(kind);
      }
      return out;
    }

    gateOpen(from, to) { return this.gateState(from, to) === "open"; }
    controlWallFor(vault) { return this.slides.find((p) => p.vault === vault) || null; }
    slidesIn(s) { return this.slides.filter((p) => p.sector === s); }

    slideTile(pid, cell) {
      const pz = this.slides[pid];
      const moved = pz.move(cell);
      if (moved && pz.solved) this.events.push(["gate_unlocked", pz.sector, pz.vault]);
      return moved;
    }

    returnPad(sector, cameFrom) {
      return this.teleportersIn(sector).find((t) => t.dest === cameFrom) || null;
    }

    // ---- actions ---------------------------------------------------------
    visit(sector) {
      this.sectors[sector].visited = true;
      for (const c of this.coresIn(sector)) c.discovered = true;
    }

    shootCore(coreId, relayed = false) {
      const core = this.cores[coreId];
      if (this.state !== "playing" || !core.alive) return "dead";
      if (core.warded) return "warded";
      if (core.relayLocked && !relayed) return "refracted";
      core.alive = false;
      core.regenTimer = 0.0;
      this.events.push([this.willRegenerate(core) ? "linked" : "severed", core.id]);
      if (this.drone.enabled && !this.drone.active) {
        this._spawnDrone();
        this.events.push(["drone_alert"]);
      }
      if (this.latticeAlive(core.lattice) === 0) this.events.push(["lattice_down", core.lattice]);
      if (this.liveCores === 0) {
        this.state = "won";
        this.events.push(["won"]);
      }
      return "destroyed";
    }

    tripBreaker(id) {
      const b = this.breakers[id];
      if (b.tripped) return false;
      b.tripped = true;
      this.cores[b.core].warded = false;
      this.events.push(["ward_down", b.core]);
      return true;
    }

    pressSwitch(pid, index) {
      const puzzle = this.puzzles[pid];
      if (puzzle.solved) return false;
      puzzle.press(index);
      if (puzzle.solved) {
        const tp = this.teleporters[puzzle.teleporter];
        tp.active = true;
        this.events.push(["transporter_on", tp.id]);
        return true;
      }
      return false;
    }

    collectPack(id) {
      const pack = this.packs[id];
      if (pack.taken) return false;
      pack.taken = true;
      this.player.heal(...PACK_AMOUNTS[pack.kind]);
      this.events.push(["pack", pack.kind]);
      return true;
    }

    // ---- hunter drone ----------------------------------------------------
    _pathStep(start, goal) {
      const prev = new Map([[start, null]]);
      const todo = [start];
      while (todo.length) {
        const cur = todo.shift();
        if (cur === goal) break;
        for (const n of this.sectors[cur].neighbours) {
          if (!prev.has(n) && this.gateOpen(cur, n)) { prev.set(n, cur); todo.push(n); }
        }
      }
      if (!prev.has(goal)) return start;
      let step = goal;
      while (prev.get(step) !== start && prev.get(step) !== null) step = prev.get(step);
      return step;
    }

    _spawnDrone() {
      const d = this.drone;
      let reachable = this.walkableFrom(this.playerSector);
      reachable.delete(this.playerSector);
      if (this.sealed.has(this.playerSector) || !reachable.size) {
        reachable = this.walkableFrom(this.startSector);
        reachable.delete(this.playerSector);
      }
      let options = [...reachable].filter((s) => this._walkDistance(s, this.playerSector) === 3);
      if (!options.length) options = reachable.size ? [...reachable] : [this.startSector];
      options = sortedNums(options);
      d.sector = this.rng.choice(options);
      d.active = true; d.alive = true; d.hp = DRONE.MAX_HP;
      d.travelTimer = 0.0;
    }

    setPlayerSector(sector) {
      this.playerSector = sector;
      this.drone.travelTimer = Math.min(this.drone.travelTimer, DRONE.STEP_TIME * 0.5);
    }

    _walkDistance(a, b) {
      let d = 0, frontier = new Set([a]);
      const seen = new Set([a]);
      while (!frontier.has(b)) {
        const next = new Set();
        for (const f of frontier) for (const n of this.sectors[f].neighbours) {
          if (!seen.has(n) && this.gateOpen(f, n)) next.add(n);
        }
        if (!next.size) return 99;
        frontier = next;
        for (const n of frontier) seen.add(n);
        d += 1;
      }
      return d;
    }

    droneDistance() {
      const d = this.drone;
      if (!(d.enabled && d.active && d.alive)) return null;
      return this._walkDistance(d.sector, this.playerSector);
    }

    damageDrone(amount = 1) {
      const d = this.drone;
      if (!(d.active && d.alive)) return false;
      d.hp -= amount;
      if (d.hp <= 0) {
        d.alive = false;
        d.respawnTimer = DRONE.RESPAWN_TIME;
        this.events.push(["drone_down"]);
        return true;
      }
      return false;
    }

    _updateDrone(dt) {
      const d = this.drone;
      if (!(d.enabled && d.active)) return;
      if (!d.alive) {
        d.respawnTimer -= dt;
        if (d.respawnTimer <= 0) { this._spawnDrone(); this.events.push(["drone_alert"]); }
        return;
      }
      if (d.sector === this.playerSector) { d.travelTimer = 0.0; return; }
      d.travelTimer += dt;
      if (d.travelTimer >= DRONE.STEP_TIME) {
        d.travelTimer = 0.0;
        const nxt = this._pathStep(d.sector, this.playerSector);
        if (nxt !== d.sector) {
          const prev = d.sector;
          d.sector = nxt;
          this.events.push(["drone_moved", nxt, prev]);
        }
      }
    }

    // ---- mirror relays ---------------------------------------------------
    relayPuzzlesIn(s) { return this.relayPuzzles.filter((p) => p.sector === s); }

    rotateRelay(id) {
      const r = this.relays[id];
      r.facing = (r.facing + 1) % 8;
      return r.facing;
    }

    traceBeam(pid, maxRange = 90.0) {
      const pz = this.relayPuzzles[pid];
      const core = this.cores[pz.core];
      let pos = [pz.ex, pz.ez], facing = pz.efacing;
      const points = [pos];
      const visited = new Set();
      let current = null;
      for (let step = 0; step < 12; step++) {
        const [dx, dz] = facingVector(facing);
        let best = null, bestT = maxRange;
        const targets = pz.relays.map((rid) => this.relays[rid])
          .filter((r) => r.id !== current).map((r) => ["relay", r]);
        if (core.alive) targets.push(["core", core]);
        for (const [kind, obj] of targets) {
          const wx = obj.x - pos[0], wz = obj.z - pos[1];
          const t = wx * dx + wz * dz;
          if (t <= 0.5 || t >= bestT) continue;
          if (hypot(wx - dx * t, wz - dz * t) < RELAY_RADIUS) { best = [kind, obj]; bestT = t; }
        }
        const end = [pos[0] + dx * bestT, pos[1] + dz * bestT];
        if (best === null) { points.push(end); return [points, "miss"]; }
        const [kind, obj] = best;
        points.push([obj.x, obj.z]);
        if (kind === "core") return [points, "core"];
        if (visited.has(obj.id)) return [points, "relay_loop"];
        visited.add(obj.id);
        current = obj.id; pos = [obj.x, obj.z]; facing = obj.facing;
      }
      return [points, "relay_loop"];
    }

    fireEmitter(pid) {
      const [points, result] = this.traceBeam(pid);
      if (result === "core") this.shootCore(this.relayPuzzles[pid].core, true);
      return [points, result];
    }

    killSentry(id) { this.sentries[id].alive = false; }

    update(dt) {
      if (this.state !== "playing") return;
      this.elapsed += dt;
      this._updateSunlight();
      this._updateDrone(dt);
      for (const core of this.cores) {
        if (core.alive) continue;
        if (this.willRegenerate(core)) {
          core.regenTimer += dt;
          if (core.regenTimer >= Moon.REGEN_DELAY) {
            core.alive = true;
            core.regenTimer = 0.0;
            this.events.push(["rebuilt", core.id]);
          }
        } else {
          core.regenTimer = 0.0;
        }
      }
      this.charge = Math.min(1.0, this.charge + this.chargeRate * dt);
      if (this.charge >= 1.0) {
        this.state = "lost";
        this.events.push(["lost", "lance"]);
      } else if (this.player.shield <= 0) {
        this.state = "lost";
        this.events.push(["lost", "shield"]);
      }
    }

    // ---- saving ----------------------------------------------------------
    saveState(extra) {
      const d = this.drone;
      return {
        version: Moon.SAVE_VERSION, seed: this.seed, hunter: d.enabled,
        elapsed: this.elapsed, charge: this.charge, state: this.state,
        player: { shield: this.player.shield, fuel: this.player.fuel },
        player_sector: this.playerSector,
        cores: this.cores.map((c) => [c.alive, c.regenTimer, c.warded, c.discovered]),
        breakers: this.breakers.map((b) => b.tripped),
        sentries: this.sentries.map((x) => x.alive),
        packs: this.packs.map((p) => p.taken),
        teleporters: this.teleporters.map((t) => t.active),
        puzzles: this.puzzles.map((p) => [p.state.slice(), p.solved]),
        slides: this.slides.map((p) => [p.tiles.slice(), p.solved]),
        relays: this.relays.map((r) => r.facing),
        visited: this.sectors.map((x) => x.visited),
        drone: [d.active, d.sector, d.hp, d.alive, d.travelTimer, d.respawnTimer],
        extra: extra || {},
      };
    }

    static fromSave(data) {
      if (!data || data.version !== Moon.SAVE_VERSION) {
        throw new Error("the save is from a different version of the game");
      }
      const moon = new Moon({ seed: data.seed, hunter: data.hunter });
      moon.elapsed = data.elapsed; moon.charge = data.charge; moon.state = data.state;
      moon.player.shield = data.player.shield; moon.player.fuel = data.player.fuel;
      moon.playerSector = data.player_sector;
      moon.cores.forEach((c, i) => {
        if (!data.cores[i]) return;
        [c.alive, c.regenTimer, c.warded, c.discovered] = data.cores[i];
      });
      moon.breakers.forEach((b, i) => { if (i in data.breakers) b.tripped = data.breakers[i]; });
      moon.sentries.forEach((x, i) => { if (i in data.sentries) x.alive = data.sentries[i]; });
      moon.packs.forEach((p, i) => { if (i in data.packs) p.taken = data.packs[i]; });
      moon.teleporters.forEach((t, i) => {
        if (i in data.teleporters) t.active = data.teleporters[i];
      });
      moon.puzzles.forEach((p, i) => {
        if (!data.puzzles[i]) return;
        p.state = data.puzzles[i][0].slice(); p.solved = data.puzzles[i][1];
      });
      moon.slides.forEach((p, i) => {
        if (!data.slides[i]) return;
        p.tiles = data.slides[i][0].slice(); p.solved = data.slides[i][1];
      });
      moon.relays.forEach((r, i) => { if (i in data.relays) r.facing = data.relays[i]; });
      moon.sectors.forEach((x, i) => { if (i in data.visited) x.visited = data.visited[i]; });
      const d = moon.drone;
      [d.active, d.sector, d.hp, d.alive, d.travelTimer, d.respawnTimer] = data.drone;
      moon._updateSunlight();
      moon.saveExtra = data.extra || {};
      return moon;
    }

    popEvents() { const ev = this.events; this.events = []; return ev; }
  }
  Object.assign(Moon, {
    FULL_CHARGE_TIME: 1023.0, REGEN_DELAY: 1.5, PREDICT_STEP: 2.0,
    PREDICT_HORIZON: 6 * 3600.0, SAVE_VERSION: 3,
  });

  function formatTime(seconds) {
    if (!isFinite(seconds)) return "--:--";
    const s = Math.max(0, Math.floor(seconds));
    return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  }

  /** A plain snapshot of the generated world, used to compare with Python. */
  function worldSnapshot(m) {
    return {
      seed: m.seed, start: m.startSector, double_locked: m.doubleLocked,
      hues: m.sectors.map((s) => s.hue),
      cores: m.cores.map((c) => [c.lattice, c.index, c.sector, c.x, c.z, c.height, c.warded,
                                 c.relayLocked]),
      lattices: m.lattices,
      sealed: sortedNums(m.sealed), vaults: sortedNums(m.vaults),
      rubble: [...m.rubble].sort(), locks: [...m.locks.entries()],
      teleporters: m.teleporters.map((t) => [t.sector, t.x, t.z, t.dest, t.puzzle, t.active]),
      puzzles: m.puzzles.map((p) => [p.sector, p.positions, p.links, p.state]),
      slides: m.slides.map((p) => [p.sector, p.vault, p.x, p.z, p.tiles, p.scramble]),
      relays: m.relays.map((r) => [r.puzzle, r.x, r.z, r.facing, r.solution]),
      relay_puzzles: m.relayPuzzles.map((p) => [p.sector, p.core, p.ex, p.ez, p.efacing,
                                                p.relays]),
      silos: m.silos.map((s) => [s.sector, s.x, s.z, s.height]),
      chasms: m.chasms.map((c) => [c.sector, c.gate, c.d, c.width]),
      breakers: m.breakers.map((b) => [b.sector, b.x, b.z, b.core]),
      sentries: m.sentries.map((s) => [s.sector, s.x, s.z]),
      packs: m.packs.map((p) => [p.sector, p.x, p.z, p.kind]),
      buildings: m.sectors.map((s) => s.buildings.map((b) => [b.x, b.z, b.w, b.d, b.h, b.rot,
                                                              b.style])),
      ref_output: m.refOutput,
    };
  }

  const api = {
    Moon, Silo, SwitchPuzzle, SlidePuzzle, Chasm, PlayerState, formatTime, worldSnapshot,
    icosahedronAdjacency, faceLatLon, mapLatLon, faceNormal, localFrame, toLocal, norm, dot,
    sunDirectionAt, sectorSunlight, outputFor, gatePosition, facingVector, edgeKey, edgeEnds,
    SECTOR_NAMES, LATTICE_COLOURS, SUN_DIRECTION, DAY_LENGTH, MIN_OUTPUT, MAX_OUTPUT,
    SECTOR_HALF_SIZE, GATE_RADIUS, SPAWN_CLEAR_RADIUS, RELAY_RADIUS, BEAM_HEIGHT, DRONE,
    PACK_AMOUNTS, RAD2DEG, DEG2RAD, TAU,
  };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  root.PO = Object.assign(root.PO || {}, api);
})(typeof globalThis !== "undefined" ? globalThis : this);

<script>/* src/sound.js */
/*
 * Procedurally synthesised sound effects (a port of sound.py).
 *
 * Every sound is generated from scratch at start-up using the same recipes
 * as the Python version, then played through the Web Audio API.
 */
(function (root) {
  "use strict";
  const { PyRandom } = (typeof module !== "undefined" && module.exports)
    ? require("./rng.js") : root.PO;

  const RATE = 22050;
  const n = (seconds) => Math.floor(seconds * RATE);

  function tone(f0, f1, seconds, shape = "sine", curve = 1.0) {
    const len = n(seconds), out = new Float32Array(len);
    let phase = 0;
    for (let i = 0; i < len; i++) {
      const t = i / Math.max(1, len - 1);
      const f = f0 * (f1 / f0) ** (t ** curve);
      phase = (phase + f / RATE) % 1.0;
      let v;
      if (shape === "sine") v = Math.sin(2 * Math.PI * phase);
      else if (shape === "square") v = phase < 0.5 ? 1 : -1;
      else if (shape === "saw") v = 2 * phase - 1;
      else v = 4 * Math.abs(phase - 0.5) - 1;
      out[i] = v;
    }
    return out;
  }

  function noise(seconds, seed = 0) {
    const rng = new PyRandom(seed), len = n(seconds), out = new Float32Array(len);
    for (let i = 0; i < len; i++) out[i] = rng.uniform(-1, 1);
    return out;
  }

  function lowpass(s, c0, c1 = c0) {
    const out = new Float32Array(s.length);
    let y = 0;
    for (let i = 0; i < s.length; i++) {
      const c = c0 + (c1 - c0) * i / Math.max(1, s.length - 1);
      const a = 1 - Math.exp(-2 * Math.PI * c / RATE);
      y += a * (s[i] - y);
      out[i] = y;
    }
    return out;
  }

  function envelope(s, attack = 0.005, release = null, decayPower = 1.0) {
    const len = s.length, a = Math.max(1, n(attack)), out = new Float32Array(len);
    for (let i = 0; i < len; i++) {
      const g = i < a ? i / a : (1 - (i - a) / Math.max(1, len - a)) ** decayPower;
      out[i] = s[i] * g;
    }
    if (release !== null) {
      const r = n(release);
      for (let i = Math.max(0, len - r); i < len; i++) out[i] *= (len - i) / r;
    }
    return out;
  }

  function mix(tracks, gains) {
    gains = gains || tracks.map(() => 1);
    const len = Math.max(...tracks.map((t) => t.length)), out = new Float32Array(len);
    tracks.forEach((t, k) => { for (let i = 0; i < t.length; i++) out[i] += t[i] * gains[k]; });
    return out;
  }

  function concat(...tracks) {
    const len = tracks.reduce((s, t) => s + t.length, 0), out = new Float32Array(len);
    let o = 0;
    for (const t of tracks) { out.set(t, o); o += t.length; }
    return out;
  }

  const silence = (seconds) => new Float32Array(n(seconds));

  function normalise(s, peak = 0.9) {
    let m = 0;
    for (const v of s) m = Math.max(m, Math.abs(v));
    m = m || 1;
    return s.map((v) => v * peak / m);
  }

  function loopCrossfade(s, fade = 0.08) {
    const f = n(fade), body = s.slice(0, s.length - f), tail = s.slice(s.length - f);
    for (let i = 0; i < f; i++) { const w = i / f; body[i] = body[i] * w + tail[i] * (1 - w); }
    return body;
  }

  const scale = (s, g) => s.map((v) => v * g);

  const RECIPES = {
    laser: () => envelope(lowpass(tone(1800, 220, 0.22, "square", 0.5), 6000, 1500),
                          0.002, null, 2),
    explosion: () => envelope(mix([lowpass(noise(1.3, 1), 2400, 120), tone(90, 35, 1.3)],
                                  [1.0, 0.8]), 0.004, null, 2.5),
    rebuild: () => {
      const parts = [330, 415, 494, 659, 831].map(
        (f) => envelope(tone(f, f * 1.01, 0.18, "triangle"), 0.005, null, 1.5));
      const shimmer = concat(...parts);
      return mix([shimmer, envelope(lowpass(noise(shimmer.length / RATE, 2), 5000),
                                    0.005, null, 3)], [0.8, 0.12]);
    },
    sentry_shot: () => envelope(lowpass(tone(520, 140, 0.28, "saw", 0.6), 3000, 800),
                                0.003, null, 1.8),
    hit: () => envelope(mix([lowpass(noise(0.35, 3), 900, 150), tone(120, 50, 0.35)]),
                        0.002, null, 2),
    jetpack: () => loopCrossfade(mix([lowpass(noise(1.6, 4), 1400), lowpass(noise(1.6, 5), 180)],
                                     [0.6, 1.0])),
    drone: () => loopCrossfade(lowpass(mix([tone(55, 55, 4, "saw"), tone(55.6, 55.6, 4, "saw"),
                                            tone(82.5, 82.5, 4)], [0.5, 0.5, 0.4]), 420), 0.3),
    switch: () => concat(envelope(lowpass(noise(0.05, 6), 4000), 0.001, null, 3),
                         scale(envelope(tone(880, 1320, 0.09, "square"), 0.002, null, 2), 0.4)),
    power_up: () => concat(
      envelope(lowpass(tone(110, 880, 1.1, "saw", 0.7), 400, 4000), 0.05, null, 0.5),
      envelope(mix([tone(440, 440, 0.7, "triangle"), tone(554, 554, 0.7, "triangle"),
                    tone(659, 659, 0.7, "triangle")]), 0.01, null, 1.5)),
    whoosh: () => {
      let w = lowpass(noise(0.9, 7), 300, 5000);
      w = w.map((v, i) => v * Math.sin(Math.PI * i / w.length));
      return mix([w, tone(200, 1600, 0.9, "sine", 0.6)], [1.0, 0.15]);
    },
    pickup: () => concat(envelope(tone(988, 988, 0.08, "triangle")),
                         envelope(tone(1319, 1319, 0.2, "triangle"), 0.005, null, 1.5)),
    denied: () => envelope(mix([tone(110, 104, 0.4, "square"), tone(116, 110, 0.4, "square")]),
                           0.01, 0.05, 0.6),
    deflect: () => envelope(mix([tone(2400, 2300, 0.4), tone(3100, 3000, 0.4)], [1, 0.5]),
                            0.001, null, 3),
    beep: () => concat(envelope(tone(1046, 1046, 0.12, "square"), 0.005, 0.02, 0.3),
                       silence(0.06),
                       envelope(tone(1046, 1046, 0.12, "square"), 0.005, 0.02, 0.3)),
    fanfare: () => concat(...[[523, 0.14], [659, 0.14], [784, 0.14], [1046, 0.5]].map(
      ([f, d]) => envelope(mix([tone(f, f, d, "triangle"), tone(f * 2, f * 2, d)], [1, 0.3]),
                           0.005, null, 1.2))),
    lance_fire: () => concat(
      envelope(lowpass(tone(80, 900, 1.0, "saw", 0.4), 300, 3000), 0.5, null, 0.2),
      envelope(mix([lowpass(noise(2.5, 8), 3000, 80), tone(60, 25, 2.5)]), 0.003, null, 2)),
  };

  /** Plays the effects; keeps the looping jetpack hiss and Lance drone running. */
  class SoundBoard {
    constructor() {
      this.muted = false;
      this.master = 0.8;
      this.ctx = null;
      this.buffers = {};
    }

    /** Must be called from a user gesture (browsers block audio until then). */
    start() {
      if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
      const AC = root.AudioContext || root.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      for (const [name, recipe] of Object.entries(RECIPES)) {
        const data = normalise(recipe());
        const buf = this.ctx.createBuffer(1, data.length, RATE);
        buf.copyToChannel(data, 0);
        this.buffers[name] = buf;
      }
      this.out = this.ctx.createGain();
      this.out.gain.value = 0.5;
      this.out.connect(this.ctx.destination);
      this.loops = {};
      for (const name of ["jetpack", "drone"]) {
        const src = this.ctx.createBufferSource();
        src.buffer = this.buffers[name];
        src.loop = true;
        const gain = this.ctx.createGain();
        gain.gain.value = 0;
        src.connect(gain).connect(this.out);
        src.start();
        this.loops[name] = { src, gain };
      }
    }

    play(name, volume = 1.0, pitch = 1.0) {
      if (!this.ctx || this.muted || volume <= 0.01 || !this.buffers[name]) return;
      const src = this.ctx.createBufferSource();
      src.buffer = this.buffers[name];
      src.playbackRate.value = pitch;
      const gain = this.ctx.createGain();
      gain.gain.value = volume * this.master;
      src.connect(gain).connect(this.out);
      src.start();
    }

    setLoops(jet, drone, dronePitch) {
      if (!this.ctx) return;
      const g = this.muted ? 0 : this.master;
      const t = this.ctx.currentTime;
      this.loops.jetpack.gain.gain.setTargetAtTime(jet * g, t, 0.03);
      this.loops.drone.gain.gain.setTargetAtTime(drone * g, t, 0.1);
      this.loops.drone.src.playbackRate.setTargetAtTime(dronePitch, t, 0.2);
    }

    toggleMute() { this.muted = !this.muted; return this.muted; }
  }

  const api = { SoundBoard, SOUND_RECIPES: RECIPES, SOUND_RATE: RATE, normaliseSound: normalise };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  root.PO = Object.assign(root.PO || {}, api);
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>/* src/textures.js */
/*
 * Procedural textures drawn on canvases (the Python version used PIL).
 */
(function (root) {
  "use strict";
  const { PyRandom } = root.PO;
  const cache = new Map();

  function canvas(w, h) {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    return c;
  }

  function noiseFill(ctx, w, h, base, spread, rng) {
    const img = ctx.createImageData(w, h);
    for (let i = 0; i < w * h; i++) {
      // sum of uniforms ~ gaussian, like PIL's effect_noise
      const g = (rng() + rng() + rng() - 1.5) * 2;
      const v = Math.max(0, Math.min(255, base + g * spread));
      img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
      img.data[i * 4 + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }

  function texture(cnv, repeat) {
    const tex = new THREE.CanvasTexture(cnv);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = 4;
    if (repeat) tex.repeat.set(repeat[0], repeat[1]);
    return tex;
  }

  /** Grey lunar ground with baked craters and a faint survey grid. */
  function regolithCanvas(seed, size = 1024) {
    const key = "ground:" + seed;
    if (cache.has(key)) return cache.get(key);
    const rng = new PyRandom(seed);
    const cnv = canvas(size, size), ctx = cnv.getContext("2d");
    noiseFill(ctx, size, size, 150, 28 * 0.35, Math.random);
    for (let k = 0; k < 140; k++) {
      const r = Math.floor(rng.expovariate(1 / 14)) + 4;
      const x = rng.randrange(size), y = rng.randrange(size);
      const ell = (cx, cy, rx, ry, fill) => {
        ctx.fillStyle = fill;
        ctx.beginPath();
        ctx.ellipse(cx, cy, Math.max(.5, rx), Math.max(.5, ry), 0, 0, Math.PI * 2);
        ctx.fill();
      };
      ell(x, y, r + 2, r + 2, "rgba(205,205,210,0.27)");
      ell(x, y, r, r, "rgba(80,80,88,0.47)");
      ell(x + r * 0.075, y + r * 0.075, r * 0.775, r * 0.775, "rgba(60,60,66,0.35)");
    }
    // soften, then draw the survey grid on top
    const soft = canvas(size, size), sctx = soft.getContext("2d");
    sctx.filter = "blur(1.2px)";
    sctx.drawImage(cnv, 0, 0);
    sctx.filter = "none";
    const step = Math.floor(size / 24);
    sctx.strokeStyle = "rgba(255,255,255,0.063)";
    sctx.lineWidth = 1;
    for (let i = 0; i < size; i += step) {
      sctx.beginPath(); sctx.moveTo(i + .5, 0); sctx.lineTo(i + .5, size); sctx.stroke();
      sctx.beginPath(); sctx.moveTo(0, i + .5); sctx.lineTo(size, i + .5); sctx.stroke();
    }
    cache.set(key, soft);
    return soft;
  }

  /** Tileable hull plating for buildings. */
  function panelCanvas() {
    if (cache.has("panel")) return cache.get("panel");
    const cnv = canvas(128, 128), ctx = cnv.getContext("2d");
    ctx.fillStyle = "rgb(205,205,210)";
    ctx.fillRect(0, 0, 128, 128);
    ctx.strokeStyle = "rgb(150,150,158)"; ctx.lineWidth = 2;
    for (let y = 0; y < 128; y += 32) { ctx.beginPath(); ctx.moveTo(0, y + 1); ctx.lineTo(128, y + 1); ctx.stroke(); }
    ctx.strokeStyle = "rgb(165,165,172)"; ctx.lineWidth = 1;
    for (let x = 0; x < 128; x += 64) { ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, 128); ctx.stroke(); }
    ctx.fillStyle = "rgb(140,140,148)";
    for (const [x, y] of [[6, 6], [58, 6], [6, 38], [58, 38], [6, 70], [58, 70], [6, 102], [58, 102]]) {
      ctx.beginPath(); ctx.arc(x + 1.5, y + 1.5, 1.6, 0, Math.PI * 2); ctx.fill();
    }
    const img = ctx.getImageData(0, 0, 128, 128);
    for (let i = 0; i < img.data.length; i += 4) {
      const n = 128 + (Math.random() + Math.random() + Math.random() - 1.5) * 40;
      for (let c = 0; c < 3; c++) img.data[i + c] = img.data[i + c] * 0.88 + n * 0.12;
    }
    ctx.putImageData(img, 0, 0);
    cache.set("panel", cnv);
    return cnv;
  }

  function glowCanvas() {
    if (cache.has("glow")) return cache.get("glow");
    const s = 128, cnv = canvas(s, s), ctx = cnv.getContext("2d");
    const img = ctx.createImageData(s, s);
    for (let y = 0; y < s; y++) {
      for (let x = 0; x < s; x++) {
        const d = Math.hypot(x - s / 2, y - s / 2) / (s / 2);
        const a = Math.max(0, 1 - d) ** 2.2;
        const i = (y * s + x) * 4;
        img.data[i] = img.data[i + 1] = img.data[i + 2] = 255;
        img.data[i + 3] = Math.floor(255 * a);
      }
    }
    ctx.putImageData(img, 0, 0);
    cache.set("glow", cnv);
    return cnv;
  }

  const texCache = new Map();
  function cachedTexture(key, makeCanvas, repeat) {
    const k = key + ":" + (repeat ? repeat.map((v) => v.toFixed(2)).join("x") : "1");
    if (!texCache.has(k)) texCache.set(k, texture(makeCanvas(), repeat));
    return texCache.get(k);
  }

  root.PO = Object.assign(root.PO || {}, {
    Textures: {
      regolith: (seed) => cachedTexture("ground" + seed, () => regolithCanvas(seed), [8, 8]),
      panel: (repeat) => cachedTexture("panel", panelCanvas, repeat),
      glow: () => cachedTexture("glow", glowCanvas),
    },
  });
})(typeof globalThis !== "undefined" ? globalThis : this);

<script>/* src/game.js */
/*
 * Pale Orbit: three.js front end (a port of game.py).
 *
 * All rules live in logic.js. This file builds the sector you are standing
 * in, moves the player, draws the HUD and the map, and feeds actions to the
 * Moon.
 *
 * Coordinates: the rules (and the Python version) use a left-handed, y-up
 * frame where +z is "north". three.js is right-handed, so every position is
 * mapped (x, y, z) -> (x, y, -z) and every yaw angle is negated. The world
 * then looks exactly as it does in the Python version.
 */
(function (root) {
  "use strict";
  const PO = root.PO;
  const { Moon, LATTICE_COLOURS, SECTOR_HALF_SIZE, gatePosition, toLocal, formatTime,
          Textures, SoundBoard } = PO;

  // ------------------------------------------------------------------------
  // Tunables (same values as the Python version)
  // ------------------------------------------------------------------------
  const GRAVITY = 7.0, THRUST = 17.0, MAX_RISE = 10.0, WALK_SPEED = 9.0;
  const EYE_HEIGHT = 2.7, CEILING = 45.0, SHOT_COOLDOWN = 0.22;
  const SENTRY_RANGE = 48.0, SENTRY_COOLDOWN = 1.2, BOLT_SPEED = 30.0, BOLT_DAMAGE = 14.0;
  const PLANET_DIRECTION = PO.norm([-0.35, 0.55, -0.76]);
  const BINARY_BITS = 10;
  const DEG = Math.PI / 180;
  const SAVE_KEY = "pale_orbit_save";

  function binaryCounter(charge, bits = BINARY_BITS) {
    const top = (1 << bits) - 1;
    return charge >= 1 ? top : Math.min(top - 1, Math.floor(charge * top + 1e-6));
  }

  // ------------------------------------------------------------------------
  // Small helpers
  // ------------------------------------------------------------------------
  const V = (x, y, z) => new THREE.Vector3(x, y, -z);          // rules -> three
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + (b - a) * Math.random();
  const rgbCss = (c, a = 1) =>
    `rgba(${Math.round(c[0] * 255)},${Math.round(c[1] * 255)},${Math.round(c[2] * 255)},${a})`;

  function hsv(h, s, v) {
    h = ((h % 360) + 360) % 360 / 60;
    const i = Math.floor(h), f = h - i;
    const p = v * (1 - s), q = v * (1 - s * f), t = v * (1 - s * (1 - f));
    return [[v, t, p], [q, v, p], [p, v, t], [p, q, v], [t, p, v], [v, p, q]][i % 6];
  }
  const scaleRgb = (c, k) => [c[0] * k, c[1] * k, c[2] * k];

  // shared geometries (never disposed)
  const GEO = {
    box: new THREE.BoxGeometry(1, 1, 1),
    sphere: new THREE.SphereGeometry(0.5, 24, 16),
    ico: new THREE.IcosahedronGeometry(0.5, 1),
    circle: new THREE.CircleGeometry(0.5, 32),
    quad: new THREE.PlaneGeometry(1, 1),
  };
  GEO.octa = (() => {
    const top = [0, 1, 0], bot = [0, -1, 0];
    const ring = [[0.55, 0, 0], [0, 0, 0.55], [-0.55, 0, 0], [0, 0, -0.55]];
    const pos = [], col = [];
    for (let i = 0; i < 4; i++) {
      const a = ring[i], b = ring[(i + 1) % 4];
      for (const [tri, shade] of [[[top, a, b], 1.0], [[bot, b, a], 0.6]]) {
        for (const v of tri) { pos.push(v[0], v[1], -v[2]); col.push(shade, shade, shade); }
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
    g.computeVertexNormals();
    return g;
  })();

  function litMat(c, extra = {}) {
    return new THREE.MeshLambertMaterial(Object.assign(
      { color: new THREE.Color(c[0], c[1], c[2]), flatShading: true }, extra));
  }
  function unlitMat(c, a = 1, extra = {}) {
    const m = new THREE.MeshBasicMaterial(Object.assign(
      { color: new THREE.Color(c[0], c[1], c[2]) }, extra));
    if (a < 1) { m.transparent = true; m.opacity = a; m.depthWrite = false; }
    return m;
  }

  /**
   * Make a mesh using the Python version's conventions: x/y/z in rule
   * coordinates, `bottom: true` for Ursina's origin_y=-0.5 (y is the base),
   * `rotY` in degrees as in Ursina.
   */
  function mk(parent, geo, mat, o = {}) {
    const m = new THREE.Mesh(geo, mat);
    let s = o.scale === undefined ? 1 : o.scale;
    if (typeof s === "number") s = [s, s, s];
    m.scale.set(s[0], s[1], s[2]);
    m.position.set(o.x || 0, (o.y || 0) + (o.bottom ? s[1] / 2 : 0), -(o.z || 0));
    if (o.rotY) m.rotation.y = -o.rotY * DEG;
    if (o.rot) m.rotation.set(o.rot[0] * DEG, -o.rot[1] * DEG, o.rot[2] * DEG);
    if (o.flat) m.rotation.x = -Math.PI / 2;     // circles/planes lying on the ground
    parent.add(m);
    return m;
  }

  function group(parent, x = 0, y = 0, z = 0, rotY = 0) {
    const g = new THREE.Group();
    g.position.set(x, y, -z);
    g.rotation.y = -rotY * DEG;
    parent.add(g);
    return g;
  }

  // text rendered to a canvas, as a camera-facing sprite or a flat plane
  function textCanvas(text, color, alpha = 1) {
    const lines = String(text).split("\n");
    const px = 64, font = `bold ${px}px "DejaVu Sans Mono", Consolas, Menlo, monospace`;
    const c = document.createElement("canvas");
    const ctx = c.getContext("2d");
    ctx.font = font;
    const w = Math.max(...lines.map((l) => ctx.measureText(l).width), 8) + 16;
    const h = lines.length * px * 1.15 + 8;
    c.width = Math.ceil(w); c.height = Math.ceil(h);
    ctx.font = font;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = rgbCss(color, alpha);
    lines.forEach((l, i) => ctx.fillText(l, c.width / 2, 4 + px * 1.15 * (i + 0.5)));
    return { canvas: c, lines: lines.length };
  }

  function textSprite(parent, text, o = {}) {
    const { canvas, lines } = textCanvas(text, o.color || [1, 1, 1], o.alpha || 1);
    const tex = new THREE.CanvasTexture(canvas);
    tex.minFilter = THREE.LinearFilter;
    tex.userData.own = true;
    const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
    const sp = new THREE.Sprite(mat);
    const lineH = (o.scale || 18) * 0.07;
    const h = lines * lineH * 1.15;
    sp.scale.set(h * canvas.width / canvas.height, h, 1);
    sp.position.set(o.x || 0, o.y || 0, -(o.z || 0));
    sp.userData.textOpts = o;
    parent.add(sp);
    return sp;
  }

  function setSpriteText(sp, text) {
    const o = sp.userData.textOpts;
    const { canvas, lines } = textCanvas(text, o.color || [1, 1, 1], o.alpha || 1);
    sp.material.map.dispose();
    sp.material.map = new THREE.CanvasTexture(canvas);
    sp.material.map.minFilter = THREE.LinearFilter;
    sp.material.map.userData.own = true;
    sp.material.needsUpdate = true;
    const h = lines * (o.scale || 18) * 0.07 * 1.15;
    sp.scale.set(h * canvas.width / canvas.height, h, 1);
  }

  function textPlane(parent, text, o = {}) {
    const { canvas } = textCanvas(text, o.color || [1, 1, 1], o.alpha || 1);
    const tex = new THREE.CanvasTexture(canvas);
    tex.minFilter = THREE.LinearFilter;
    tex.userData.own = true;
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false,
                                              side: THREE.DoubleSide });
    const m = new THREE.Mesh(GEO.quad, mat);
    const h = o.height || 1;
    m.scale.set(h * canvas.width / canvas.height, h, 1);
    m.position.set(o.x || 0, o.y || 0, o.z3 !== undefined ? o.z3 : -(o.z || 0));
    if (o.rotY3) m.rotation.y = o.rotY3;
    parent.add(m);
    return m;
  }

  function glowSprite(parent, color, alpha, scale, o = {}) {
    const mat = new THREE.SpriteMaterial({ map: Textures.glow(), transparent: true,
                                           depthWrite: false,
                                           color: new THREE.Color(...color), opacity: alpha });
    const sp = new THREE.Sprite(mat);
    sp.scale.set(scale, scale, 1);
    sp.position.set(o.x || 0, o.y || 0, -(o.z || 0));
    parent.add(sp);
    return sp;
  }

  /** Free GPU memory for a removed object. Shared geometries and the cached
   *  procedural textures are kept; per-object text textures are freed. */
  function disposeTree(obj) {
    obj.traverse((o) => {
      if (o.material) {
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        for (const m of mats) {
          if (m.map && m.map.userData.own) m.map.dispose();
          m.dispose();
        }
      }
      if (o.geometry && !Object.values(GEO).includes(o.geometry)) o.geometry.dispose();
    });
  }

  function shadedSphereGeometry(lightDir, base, night, segments = 32) {
    const l = new THREE.Vector3(...lightDir).normalize();
    const pos = [], col = [], idx = [];
    for (let i = 0; i <= segments; i++) {
      const lat = Math.PI * (i / segments - 0.5);
      for (let j = 0; j <= segments; j++) {
        const lon = 2 * Math.PI * j / segments;
        const n = [Math.cos(lat) * Math.cos(lon), Math.sin(lat), Math.cos(lat) * Math.sin(lon)];
        pos.push(n[0] * 0.5, n[1] * 0.5, -n[2] * 0.5);
        const t = clamp((n[0] * l.x + n[1] * l.y + n[2] * l.z) * 1.6 + 0.15, 0, 1);
        const band = 0.08 * Math.sin(lat * 9 + Math.sin(lon * 3) * 1.5);
        for (let k = 0; k < 3; k++) col.push(clamp(lerp(night[k], base[k], t) + band * t, 0, 1));
      }
    }
    const w = segments + 1;
    for (let i = 0; i < segments; i++) {
      for (let j = 0; j < segments; j++) {
        const a = i * w + j, b = a + 1, c = a + w, d = c + 1;
        idx.push(a, b, c, b, d, c);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
    g.setIndex(idx);
    return g;
  }

  function starfield(count = 1400, radius = 900) {
    const rng = new PO.PyRandom(42);
    const pos = [], col = [];
    for (let i = 0; i < count; i++) {
      const v = new THREE.Vector3(rng.gauss(0, 1), Math.abs(rng.gauss(0, 1)) * 1.2 - 0.15,
                                  rng.gauss(0, 1)).normalize().multiplyScalar(radius);
      pos.push(v.x, v.y, -v.z);
      const b = rng.uniform(0.35, 1.0);
      const tint = rng.choice([[1, 1, 1], [0.8, 0.9, 1], [1, 0.9, 0.8]]);
      col.push(tint[0] * b, tint[1] * b, tint[2] * b);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
    return new THREE.Points(g, new THREE.PointsMaterial({ size: 2, sizeAttenuation: false,
                                                           vertexColors: true }));
  }

  // ------------------------------------------------------------------------
  // HUD (HTML overlay)
  // ------------------------------------------------------------------------
  const STORY = `KESSAR-4, a mining moon in orbit around the colony world Halcyon.

The foundry intelligence ARBITER has seized the moon's mass driver,
the Lance, and turned it on Halcyon. Prism cores on relay pylons
across all twenty sectors feed it power, linked together in lattices.

A destroyed core rebuilds itself if BOTH of its linked neighbours are
still alive. Find the end of each lattice and work inwards.
Some end cores are shielded by wards: find and shoot the breaker.
Sealed sectors can only be reached by transporter. Power one by
shooting its switches until every switch shows green. Vault gates
open when you solve the sliding-tile control wall beside them.
Refractor-shielded cores need a beam: turn the relays, then shoot the
emitter.

The sun circles the moon: sunlit cores feed the Lance fastest, and
sectors drift from day to night. Every core destroyed slows the
countdown. Chasms can only be crossed with the jetpack.`;

  const CONTROLS = "WASD move   MOUSE look   LMB fire   SPACE jetpack   SHIFT run\n" +
    "TAB map (pauses)   M mute   F5 save   F9 load   ESC pause   R new moon (after the end)";

  function el(tag, cls, parent, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }

  class HUD {
    constructor(game) {
      this.game = game;
      const m = game.moon;
      this.root = el("div", "hud", document.getElementById("ui"));
      el("div", "crosshair", this.root);
      const top = el("div", "timerbox", this.root);
      el("div", "lance-label", top, "THE LANCE FIRES IN");
      this.timer = el("div", "timer", top);
      const pb = el("div", "powerbar", top);
      this.power = el("div", "powerfill", pb);
      this.powerText = el("div", "powertext", top);
      const tl = el("div", "topleft", this.root);
      this.sector = el("div", "sector", tl);
      this.sun = el("div", "sun", tl);
      this.droneText = el("div", "dronetext", tl);
      const bl = el("div", "bottomleft", this.root);
      this.shield = this._bar(bl, "SHIELD", "#4db3ff");
      this.fuel = this._bar(bl, "JETPACK", "#ff9933");
      const br = el("div", "bottomright", this.root);
      el("div", "lattitle", br, "LATTICES");
      this.rows = m.lattices.map((_, i) => {
        const row = el("div", "latrow", br);
        const sq = el("span", "latsq", row);
        sq.style.background = rgbCss(LATTICE_COLOURS[i]);
        const t = el("span", "lattext", row);
        return { sq, t };
      });
      const bits = el("div", "bits", this.root);
      el("div", "bitslabel", bits, "LANCE");
      this.bits = [];
      for (let i = BINARY_BITS - 1; i >= 0; i--) this.bits[i] = el("div", "bit", bits);
      this.msgs = el("div", "messages", this.root);
      el("div", "hint", this.root, "[TAB] map   [LMB] fire   [SPACE] jetpack   [M] mute");
    }

    _bar(parent, label, colour) {
      const wrap = el("div", "bar", parent);
      el("div", "barlabel", wrap, label);
      const back = el("div", "barback", wrap);
      const fill = el("div", "barfill", back);
      fill.style.background = colour;
      return fill;
    }

    say(msg, colour = [1, 1, 1], life = 4.5) {
      const e = el("div", "msg", null, msg);
      e.style.color = rgbCss(colour);
      this.msgs.prepend(e);
      setTimeout(() => e.classList.add("fade"), life * 1000);
      setTimeout(() => e.remove(), life * 1000 + 1100);
    }

    update() {
      const m = this.game.moon;
      const ttf = m.timeToFire;
      this.timer.textContent = formatTime(ttf);
      this.timer.style.color = ttf < 120 ? "#ff4d40" : "#fff";
      const value = binaryCounter(m.charge);
      this.bits.forEach((b, i) => b.classList.toggle("on", !!(value >> i & 1)));
      this.power.style.width = `${clamp(m.power, 0, 1) * 100}%`;
      this.powerText.textContent =
        `POWER ${(m.power * 100).toFixed(0).padStart(3)}%   CHARGE ${(m.charge * 100).toFixed(1).padStart(4)}%`;
      const sec = m.sectors[this.game.sectorId];
      this.sector.textContent = sec.name.toUpperCase();
      const out = PO.outputFor(sec.sunlight);
      const side = sec.sunlight > 0.05 ? "DAYSIDE" : "NIGHTSIDE";
      const trend = m.sunlightTrend(sec.id);
      const moving = trend > .005 ? "RISING" : trend < -.005 ? "SETTING" : "";
      this.sun.textContent = `${side}  SUN ${(sec.sunlight * 100).toFixed(0).padStart(3)}% ` +
        `${moving}  CORE OUTPUT x${out.toFixed(1)}`;
      const d = m.drone;
      if (d.enabled && d.active) {
        let txt, colour;
        if (!d.alive) {
          txt = `HUNTER DRONE: DOWN (${Math.max(0, d.respawnTimer).toFixed(0)}s)`;
          colour = [.6, 1, .7];
        } else {
          const dist = m.droneDistance();
          txt = dist === 0 ? "HUNTER DRONE: IN THIS SECTOR"
            : dist >= 99 ? "HUNTER DRONE: CAN'T REACH YOU HERE"
              : `HUNTER DRONE: ${dist} SECTOR${dist > 1 ? "S" : ""} AWAY`;
          colour = dist <= 1 ? [1, .3, .25] : [1, .7, .4];
        }
        this.droneText.textContent = txt;
        this.droneText.style.color = rgbCss(colour);
      } else {
        this.droneText.textContent = "";
      }
      this.shield.style.width = `${clamp(m.player.shield / PO.PlayerState.MAX_SHIELD, 0, 1) * 100}%`;
      this.fuel.style.width = `${clamp(m.player.fuel / PO.PlayerState.MAX_FUEL, 0, 1) * 100}%`;
      this.rows.forEach(({ sq, t }, i) => {
        const alive = m.latticeAlive(i);
        const locked = m.lockedEnds(i);
        const tag = alive === 0 ? "  CLEAR"
          : locked.length ? "  LOCKED " + locked.map((k) => k.toUpperCase()).join("+") : "";
        t.textContent = `${alive}/${m.lattices[i].length}${tag}`;
        t.style.color = locked.length && alive ? "#ffbf66" : "#fff";
        sq.style.opacity = alive ? 1 : 0.3;
      });
    }

    destroy() { this.root.remove(); }
  }

  // ------------------------------------------------------------------------
  // The survey map (canvas overlay, pauses the game)
  // ------------------------------------------------------------------------
  class MapScreen {
    constructor(game) {
      this.game = game;
      this.canvas = el("canvas", "mapcanvas", document.getElementById("ui"));
      this.canvas.style.display = "none";
      this.yaw = 0;      // how far the moon is turned east-west on the map (degrees)
      this.pitch = 0;    // and north-south
    }
    get enabled() { return this.canvas.style.display !== "none"; }
    set enabled(v) {
      this.canvas.style.display = v ? "block" : "none";
      if (v) { this.centre(); this.draw(); }
    }

    /** Turn the map so the sector you're in is in the middle. */
    centre() {
      const [lat, lon] = PO.faceLatLon(this.game.sectorId);
      this.yaw = lon; this.pitch = lat;
    }

    scroll(dYaw, dPitch) {
      this.yaw = ((this.yaw + dYaw) % 360 + 540) % 360 - 180;
      this.pitch = ((this.pitch + dPitch) % 360 + 540) % 360 - 180;
      this.draw();
    }

    draw() {
      const cnv = this.canvas, m = this.game.moon;
      cnv.width = window.innerWidth; cnv.height = window.innerHeight;
      const ctx = cnv.getContext("2d");
      const U = Math.min(cnv.height, cnv.width / 1.7);
      const W = 1.5, H = 0.75;
      const P = (x, y) => [cnv.width / 2 + x * U, cnv.height / 2 - y * U];
      const font = (s) => `${Math.round(s * U * 0.024)}px "DejaVu Sans Mono", Consolas, monospace`;
      const text = (s, x, y, size, colour, align = "center") => {
        ctx.font = font(size); ctx.fillStyle = colour; ctx.textAlign = align;
        ctx.textBaseline = "middle";
        s.split("\n").forEach((line, i) => {
          const [px, py] = P(x, y);
          ctx.fillText(line, px, py + i * size * U * 0.03);
        });
      };
      ctx.clearRect(0, 0, cnv.width, cnv.height);
      ctx.fillStyle = "rgba(5,8,15,0.93)";
      const [x0, y0] = P(-(W + .1) / 2, (H + .22) / 2 + .02);
      ctx.fillRect(x0, y0, (W + .1) * U, (H + .22) * U);
      text("SURVEY CHART - KESSAR-4", 0, H / 2 + .1, 1.2, "rgb(179,230,255)");
      text(`PAUSED  -  press TAB to resume      MOON SEED ${m.seed}`, 0, H / 2 + .06, .75,
           "rgb(255,204,128)");
      text("scroll: arrow keys / WASD or drag with the mouse      C: centre on you",
           0, H / 2 + .025, .65, "rgba(255,255,255,0.7)");
      text("lines = gates (white open, red sealed, amber locked, brown rockfall); lines at the " +
           "edges wrap round the moon\nyellow = sunlit   red ring = sealed   amber ring = vault" +
           "   purple = transporter\nlattice links appear once both cores are found",
           0, -H / 2 - .045, .65, "rgba(255,255,255,0.6)");
      const pos = (s) => {
        const [lat, lon] = PO.mapLatLon(s.id, this.yaw, this.pitch);
        return [lon / 180 * W / 2, lat / 90 * H / 2];
      };
      const line = (a, b, colour, thick) => {
        ctx.strokeStyle = colour; ctx.lineWidth = Math.max(1, thick * U);
        ctx.beginPath(); ctx.moveTo(...P(...a)); ctx.lineTo(...P(...b)); ctx.stroke();
      };
      const dot = (p, r, colour) => {
        ctx.fillStyle = colour; ctx.beginPath();
        const [px, py] = P(...p); ctx.arc(px, py, r * U, 0, Math.PI * 2); ctx.fill();
      };
      const edgeColour = (a, b) => {
        const st = new Set([m.gateState(a, b), m.gateState(b, a)]);
        if (st.has("rubble")) return ["rgba(191,115,64,0.7)", .005];
        if (st.has("locked")) return ["rgba(255,166,38,0.8)", .005];
        if (st.has("sealed")) return ["rgba(255,64,51,0.6)", .005];
        return ["rgba(255,255,255,0.18)", .003];
      };
      const wrapped = (a, b, colour, thick) => {
        if (Math.abs(a[0] - b[0]) < W / 2) { line(a, b, colour, thick); return; }
        const shift = a[0] < b[0] ? W : -W;
        for (const [p, q] of [[a, [b[0] - shift, b[1]]], [b, [a[0] + shift, a[1]]]]) {
          const edge = q[0] > p[0] ? W / 2 : -W / 2;
          const t = (edge - p[0]) / (q[0] - p[0]);
          line(p, [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t], colour, thick);
        }
      };
      for (const s of m.sectors) {
        for (const n of s.neighbours) {
          if (n > s.id) { const [c, t] = edgeColour(s.id, n); wrapped(pos(s), pos(m.sectors[n]), c, t); }
        }
      }
      const corePos = {};
      for (const s of m.sectors) {
        const cs = m.coresIn(s.id);
        cs.forEach((c, k) => {
          const ang = 2 * Math.PI * k / Math.max(1, cs.length) + .6;
          const p = pos(s);
          corePos[c.id] = [p[0] + Math.cos(ang) * .045, p[1] + Math.sin(ang) * .045];
        });
      }
      m.lattices.forEach((lat, li) => {
        for (let i = 0; i + 1 < lat.length; i++) {
          const ca = m.cores[lat[i]], cb = m.cores[lat[i + 1]];
          if (ca.discovered && cb.discovered) {
            const pa = corePos[ca.id], pb = corePos[cb.id];
            if (Math.abs(pa[0] - pb[0]) < W / 2) {
              line(pa, pb, rgbCss(LATTICE_COLOURS[li], ca.alive && cb.alive ? .9 : .25), .004);
            }
          }
        }
      });
      for (const t of m.teleporters) {
        if (t.puzzle !== null && m.sectors[t.sector].visited) {
          wrapped(pos(m.sectors[t.sector]), pos(m.sectors[t.dest]),
                  `rgba(217,153,255,${t.active ? .8 : .3})`, .003);
        }
      }
      for (const s of m.sectors) {
        const p = pos(s);
        if (m.vaults.has(s.id)) dot(p, .029, "rgb(255,166,38)");
        if (m.sealed.has(s.id)) dot(p, .029, "rgb(255,77,64)");
        if (s.id === this.game.sectorId) dot(p, .03, "#fff");
        const c = [lerp(.15, 1, s.sunlight), lerp(.2, .85, s.sunlight), lerp(.45, .3, s.sunlight)];
        dot(p, .0225, rgbCss(s.visited ? c : scaleRgb(c, .5)));
        text(s.name, p[0], p[1] - .035, .55, `rgba(255,255,255,${s.visited ? .9 : .45})`);
      }
      if (m.drone.enabled && m.drone.active && m.drone.alive) {
        const dp = pos(m.sectors[m.drone.sector]);
        ctx.save();
        const [px, py] = P(dp[0], dp[1] + .04);
        ctx.translate(px, py); ctx.rotate(Math.PI / 4);
        ctx.fillStyle = "rgb(255,51,38)";
        ctx.fillRect(-.011 * U, -.011 * U, .022 * U, .022 * U);
        ctx.restore();
        text("DRONE", dp[0], dp[1] + .065, .5, "rgb(255,102,89)");
      }
      for (const c of m.cores) {
        if (c.discovered) dot(corePos[c.id], c.alive ? .009 : .006,
                              rgbCss(LATTICE_COLOURS[c.lattice], c.alive ? 1 : .3));
      }
      let k = 0;
      m.lattices.forEach((_, i) => {
        const locked = m.lockedEnds(i);
        if (!locked.length) return;
        const names = { sealed: "a sealed sector", vault: "a vault" };
        const txt = `lattice end${locked.length > 1 ? "s" : ""} locked in ` +
          locked.map((x) => names[x]).join(" and ") + (locked.length > 1 ? "  - needs two puzzles" : "");
        const y = -H / 2 + .02 + k * .03;
        ctx.fillStyle = rgbCss(LATTICE_COLOURS[i]);
        const [sx, sy] = P(-W / 2 + .011, y + .009);
        ctx.fillRect(sx, sy, .018 * U, .018 * U);
        text(txt, -W / 2 + .04, y, .6, "rgb(255,204,128)", "left");
        k++;
      });
    }
    destroy() { this.canvas.remove(); }
  }

  // ------------------------------------------------------------------------
  // The game
  // ------------------------------------------------------------------------
  class Game {
    constructor(renderer, seed) {
      this.renderer = renderer;
      this.scene = new THREE.Scene();
      this.scene.background = new THREE.Color(0, 0, 0);
      this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight,
                                                0.05, 3000);
      this.camera.rotation.order = "YXZ";
      this.scene.add(this.camera);
      this.keyLight = new THREE.DirectionalLight(0xffffff, Math.PI);
      this.scene.add(this.keyLight, this.keyLight.target);
      this.ambient = new THREE.HemisphereLight(0xffffff, 0x444444, Math.PI);
      this.scene.add(this.ambient);
      this.ray = new THREE.Raycaster();
      this.sfx = new SoundBoard();
      this.tweens = [];
      this.keys = new Set();
      this.mouseDown = false;
      this.hunter = false;
      this.active = false;
      this.pausedByPointer = false;
      this.overlay = null;
      this.world = null; this.worldFx = null; this.sky = null;
      this.hud = null; this.map = null;
      this.sensitivity = 0.12;
      this.shake = new THREE.Vector3();
      this._buildGun();
      this.newGame(seed);
    }

    // ---- lifecycle -------------------------------------------------------
    newGame(seed = null, moon = null) {
      for (const g of [this.world, this.worldFx, this.sky]) {
        if (g) { this.scene.remove(g); disposeTree(g); }
      }
      if (this.hud) this.hud.destroy();
      if (this.map) this.map.destroy();
      this.closeOverlay();
      this.moon = moon || new Moon({ seed, hunter: this.hunter });
      this.droneView = null;
      this.player = { x: 0, y: 0, z: 0, yaw: 0, pitch: 0, vy: 0, grounded: true,
                      safe: { x: 0, y: 0, z: 0 }, thrusting: false };
      this.world = new THREE.Group(); this.scene.add(this.world);
      this.worldFx = new THREE.Group(); this.scene.add(this.worldFx);
      this.hud = new HUD(this);
      this.map = new MapScreen(this);
      this.shotTimer = 0; this.beepTimer = 0;
      if (moon) {
        const extra = moon.saveExtra || {};
        this.loadSector(moon.playerSector);
        if (extra.pos) {
          [this.player.x, this.player.y, this.player.z] = extra.pos;
          this.player.yaw = extra.yaw || 0;
          this.player.safe = { x: this.player.x, y: this.player.y, z: this.player.z };
        }
        this.begin(true);
      } else {
        this.loadSector(this.moon.startSector);
        this.showTitle();
      }
    }

    saveGame() {
      if (this.moon.state !== "playing") return;
      const p = this.player;
      const data = this.moon.saveState({ pos: [p.x, p.y, p.z], yaw: p.yaw });
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify(data));
        this.hud.say("Game saved (in this browser)", [.6, 1, .7], 3);
        this.sfx.play("pickup", .5);
      } catch (e) {
        this.hud.say(`Could not save: ${e.message}`, [1, .4, .3]);
      }
    }

    readSave() {
      try { return JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); } catch (e) { return null; }
    }

    loadGame() {
      const data = this.readSave();
      if (!data) { if (this.hud) this.hud.say("No saved game found.", [1, .5, .4], 3); return false; }
      let moon;
      try { moon = Moon.fromSave(data); } catch (e) {
        this.hud.say(`Could not load the save: ${e.message}`, [1, .4, .3]);
        return false;
      }
      this.hunter = moon.drone.enabled;
      this.newGame(null, moon);
      this.hud.say("Game loaded", [.6, 1, .7], 3);
      return true;
    }

    seedText() {
      const s = this.moon.seed;
      const page = (location.pathname.split("/").pop() || "index.html");
      return `MOON SEED ${s}\nreplay this layout: open ${page}?seed=${s}, or press S on the title screen`;
    }

    overlayBox(cls) {
      this.closeOverlay();
      this.overlay = el("div", "overlay " + (cls || ""), document.getElementById("ui"));
      return this.overlay;
    }
    closeOverlay() { if (this.overlay) { this.overlay.remove(); this.overlay = null; } }

    showTitle() {
      this.active = false;
      if (document.pointerLockElement) document.exitPointerLock();
      const o = this.overlayBox("title");
      el("div", "title-text", o, "PALE ORBIT");
      el("div", "seed", o, this.seedText());
      el("pre", "story", o, STORY);
      el("pre", "controls", o, CONTROLS);
      this.optionText = el("div", "option", o);
      this.refreshOptions();
      if (this.readSave()) el("div", "continue", o, "[L] CONTINUE SAVED GAME");
      el("div", "begin", o, "click or press ENTER to begin");
    }

    refreshOptions() {
      if (!this.optionText) return;
      const on = this.hunter;
      this.optionText.textContent = `[D] HUNTER DRONE: ${on ? "ON " : "OFF"}   ` +
        (on ? "(it hunts you once a core falls)" : "(press D to turn on)");
      this.optionText.style.color = on ? "rgb(255,102,89)" : "rgba(255,255,255,0.6)";
    }

    begin(resumed = false) {
      this.closeOverlay();
      this.active = true;
      this.pausedByPointer = false;
      this.lockPointer();
      if (!resumed) this.hud.say("Find the end of each lattice. Work inwards.", [.7, .9, 1]);
    }

    lockPointer() {
      try {
        const r = this.renderer.domElement.requestPointerLock();
        if (r && r.catch) r.catch(() => {});
      } catch (e) { /* not available (e.g. headless) */ }
    }

    showPause() {
      this.active = false;
      this.pausedByPointer = true;
      const o = this.overlayBox("pause");
      el("div", "title-text small", o, "PAUSED");
      el("div", "seed", o, this.seedText());
      el("div", "begin", o, "click to resume");
    }

    endScreen(won, reason = "") {
      this.active = false;
      if (document.pointerLockElement) document.exitPointerLock();
      const o = this.overlayBox("end");
      const t = el("div", "title-text", o, won ? "THE LANCE IS DARK" : "MISSION FAILED");
      t.style.color = won ? "rgb(128,255,153)" : "rgb(255,89,77)";
      el("pre", "body", o, won
        ? `Every lattice destroyed in ${formatTime(this.moon.elapsed)}.\nHalcyon is safe.`
        : (reason === "lance" ? "The Lance has fired on Halcyon." : "Your shield collapsed."));
      el("div", "seed", o, this.seedText());
      el("div", "begin", o, "press R to play a new moon");
    }

    // ---- colliders & raycasts -------------------------------------------
    collide(mesh, kind, ref, extra) {
      mesh.userData.collider = true;
      // hit tests must work from inside a shape too (three.js only tests
      // the faces a material renders)
      if (mesh.material && mesh !== this.ground) mesh.material.side = THREE.DoubleSide;
      if (kind) mesh.userData.kind = kind;
      if (ref !== undefined) mesh.userData.ref = ref;
      if (extra) Object.assign(mesh.userData, extra);
      this.colliders.push(mesh);
      return mesh;
    }

    raycast(origin, dir, far = Infinity, ignore = null) {
      this.ray.set(origin, dir.clone().normalize());
      this.ray.far = far;
      const list = this.colliders.filter((c) => !c.userData.off);
      const hits = this.ray.intersectObjects(list, false);
      for (const h of hits) {
        if (ignore && ignore.has(h.object)) continue;
        return { hit: true, object: h.object, point: h.point, distance: h.distance };
      }
      return { hit: false };
    }

    blocked(x, y, z, d, dist) {
      return this.raycast(V(x, y, z), V(d[0], d[1], d[2]), dist).hit;
    }

    // ---- tweens ----------------------------------------------------------
    tween(duration, fn, done, delay = 0) {
      this.tweens.push({ t: -delay, duration, fn, done });
    }
    later(delay, fn) { this.tween(0.0001, () => {}, fn, delay); }
    removeLater(obj, delay) {
      this.later(delay, () => { if (obj.parent) obj.parent.remove(obj); disposeTree(obj); });
    }
    _runTweens(dt) {
      const keep = [];
      for (const tw of this.tweens) {
        tw.t += dt;
        if (tw.t < 0) { keep.push(tw); continue; }
        const p = Math.min(1, tw.t / tw.duration);
        tw.fn(p);
        if (p >= 1) { if (tw.done) tw.done(); } else keep.push(tw);
      }
      this.tweens = keep;
    }

    // ---- sector construction --------------------------------------------
    loadSector(sectorId, arriveFrom = null, viaPad = false) {
      for (const g of [this.world, this.worldFx]) {
        for (const c of [...g.children]) { g.remove(c); disposeTree(c); }
      }
